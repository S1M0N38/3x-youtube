<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>3x YouTube</title>
        <link rel="stylesheet" href="menu.css">
        <script src="menu.js" defer></script>
    </head>
    <body>
        <div id="menuWrapper">
            <div id="menuContainer">
                <!--display title and current video speed-->
                <h2 id="title">3x YouTube</h2>
                <h3 id="currentSpeedLabel">Current Playback Speed:</h3>
                <div id="currentSpeed" aria-live="polite" aria-labelledby="currentSpeedLabel">Loading…</div>

                <!--custom speed input-->
                <label id="inputTitle" for="speedInput">Set Custom Speed:</label>
                <input type="number" id="speedInput" value="3" step="0.1" min="0.1" max="16"
                       inputmode="decimal" aria-describedby="status" />

                <!--speed selectors-->
                <div id="presets">
                    <button type="button" class="button speed-option" data-speed="1.5">1.5x</button>
                    <button type="button" class="button speed-option" data-speed="2">2x</button>
                    <button type="button" class="button speed-option" data-speed="2.5">2.5x</button>
                    <button type="button" class="button speed-option" data-speed="3">3x</button>
                    <button type="button" class="button speed-option" data-speed="3.5">3.5x</button>
                    <button type="button" class="button speed-option" data-speed="4">4x</button>
                    <button type="button" class="button speed-option" data-speed="5">5x</button>
                    <button type="button" class="button speed-option" data-speed="6">6x</button>
                </div>

                <!--speed apply and reset buttons-->
                <button type="button" id="setSpeed" class="button">Apply Speed</button>
                <button type="button" id="resetSpeed" class="button">Reset to 1x</button>

                <p id="status" role="status" aria-live="polite"></p>
                <p class="hint" id="hint">Shortcuts: <kbd>Alt</kbd>+<kbd>↑</kbd> / <kbd>Alt</kbd>+<kbd>↓</kbd> by 0.25x, <kbd>Alt</kbd>+<kbd>0</kbd> resets</p>
            </div>
        </div>
    </body>
</html>
